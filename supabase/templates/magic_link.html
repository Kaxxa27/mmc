<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Movie Catalog</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background: #f4f4f7;
      font-family:
        -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #1f2933;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background: #f4f4f7; padding: 32px 16px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="max-width: 480px; background: #ffffff; border-radius: 12px; padding: 32px"
          >
            <tr>
              <td style="font-size: 20px; font-weight: 700; color: #e50914; padding-bottom: 24px">
                🎬 My Movie Catalog
              </td>
            </tr>
            <tr>
              <td style="font-size: 22px; font-weight: 700; padding-bottom: 8px">
                Your sign-in code
              </td>
            </tr>
            <tr>
              <td style="font-size: 15px; line-height: 22px; padding-bottom: 24px">
                Use this code to sign in to your account.
              </td>
            </tr>
            <tr>
              <td align="center" style="padding-bottom: 24px">
                <div
                  style="
                    display: inline-block;
                    font-size: 34px;
                    letter-spacing: 10px;
                    font-weight: 700;
                    font-family: 'SFMono-Regular', Menlo, Consolas, monospace;
                    background: #f4f4f7;
                    border-radius: 8px;
                    padding: 14px 22px;
                  "
                >
                  {{ .Token }}
                </div>
              </td>
            </tr>
            <tr>
              <td style="font-size: 15px; line-height: 22px; padding-bottom: 16px">
                Or sign in with one click:
              </td>
            </tr>
            <tr>
              <td align="center" style="padding-bottom: 24px">
                <a
                  href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email"
                  style="
                    display: inline-block;
                    background: #e50914;
                    color: #ffffff;
                    text-decoration: none;
                    font-weight: 600;
                    border-radius: 8px;
                    padding: 12px 24px;
                  "
                  >Sign in to My Movie Catalog</a
                >
              </td>
            </tr>
            <tr>
              <td style="font-size: 13px; line-height: 20px; color: #616e7c">
                The code and the link expire in 10 minutes and can be used only once. If you did not
                try to sign in with {{ .Email }}, you can safely ignore this email.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
